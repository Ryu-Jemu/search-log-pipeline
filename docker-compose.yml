# 로컬 실험용 단일 노드 구성. 운영 구성이 아니다(복제·인증·TLS 없음).
services:
  kafka:
    image: mirror.gcr.io/apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      retries: 20

  clickhouse:
    image: mirror.gcr.io/clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_USER: slp
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-slp_local_only}
      CLICKHOUSE_DB: slp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping"]
      interval: 5s
      retries: 20

  # ---- 3단계: 시간별 지표 DAG (docker compose --profile airflow up -d --wait) ----
  postgres:  # Airflow 메타DB
    image: mirror.gcr.io/postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_local_only}
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20

  airflow:  # standalone: api-server·scheduler·dag-processor·triggerer를 한 컨테이너에서(로컬 실험용)
    build: ./airflow
    image: slp-airflow:3.3.2
    profiles: ["airflow"]
    command: standalone
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_local_only}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # 로컬 전용: 로그인 없이 UI 접근
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
      PYTHONPATH: /opt/airflow/src
      CH_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-slp_local_only}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 10s
      retries: 30
      start_period: 30s

  # ---- 4단계: 관측 (docker compose --profile obs up -d --wait) ----
  kafka-exporter:  # 소비 그룹 lag를 수집기 밖에서 잰다(수집기가 죽어도 lag가 보이게)
    image: mirror.gcr.io/danielqsj/kafka-exporter:v1.10.0
    profiles: ["obs"]
    command: ["--kafka.server=kafka:19092"]
    depends_on:
      kafka: {condition: service_healthy}

  prometheus:
    image: mirror.gcr.io/prom/prometheus:v3.15.0
    profiles: ["obs"]
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d",
              "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    extra_hosts: ["host.docker.internal:host-gateway"]  # 호스트에서 도는 수집기(:8000)를 수집
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null"]
      interval: 5s
      retries: 20

  grafana:
    image: mirror.gcr.io/grafana/grafana:13.2.4
    profiles: ["obs"]
    ports: ["3000:3000"]
    depends_on:
      prometheus: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.22.1  # 프로비저닝 전에 설치(버전 고정)
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # 로컬 전용: 로그인 없이 보기(스크린샷용)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-slp_local_only}
      GF_USERS_DEFAULT_THEME: light
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-slp_local_only}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      retries: 30
