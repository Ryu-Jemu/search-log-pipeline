# 로컬 관측 실험용. 수집기는 호스트에서 돌고(--metrics-port 8000), lag는 kafka-exporter가 밖에서 잰다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
